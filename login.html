<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sistema de Gestão de Saúde</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F0FDF4;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid #D1FAE5;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(15,61,34,.13);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(160deg, #0F3D22 0%, #14532D 60%, #0A2A18 100%);
      padding: 32px 32px 28px;
      text-align: center;
    }
    .logo-icon {
      width: 52px; height: 52px;
      background: rgba(255,255,255,.15);
      border: 1.5px solid rgba(255,255,255,.3);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin: 0 auto 14px;
    }
    .card-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .card-header p {
      font-size: .75rem;
      color: rgba(255,255,255,.6);
    }

    .card-body {
      padding: 28px 32px 32px;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #D1FAE5;
      border-radius: 8px;
      background: #F0FDF4;
      color: #111827;
      font-size: .92rem;
      font-family: inherit;
      transition: border .15s, box-shadow .15s;
    }
    .field input:focus {
      outline: none;
      border-color: #166534;
      box-shadow: 0 0 0 3px rgba(22,163,74,.15);
      background: #fff;
    }

    .erro {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .82rem;
      color: #DC2626;
      margin-bottom: 16px;
      display: none;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #14532D;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-top: 4px;
    }
    .btn-login:hover   { background: #0F3D22; transform: translateY(-1px); }
    .btn-login:active  { transform: translateY(0); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .footer {
      margin-top: 20px;
      font-size: .72rem;
      color: #9CA3AF;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="logo-icon">🏥</div>
      <h1>Sistema de Gestão de Saúde</h1>
      <p>DataSUS · CNES · Atende SUS</p>
    </div>
    <div class="card-body">
      <form onsubmit="fazerLogin(event)">
        <div class="field">
          <label>Usuário</label>
          <input type="text" id="inp-usuario" placeholder="seu.usuario" autocomplete="username" />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="inp-senha" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="erro" id="erro-msg"></div>
        <button type="submit" class="btn-login" id="btn-login">Entrar</button>
      </form>
    </div>
  </div>

  <p class="footer">Desenvolvido por Rodrigo de Godoy Soares</p>

  <script>
    // Foca no campo usuário ao abrir
    document.getElementById('inp-usuario').focus();

    async function fazerLogin(e) {
      e.preventDefault();
      const btn  = document.getElementById('btn-login');
      const erro = document.getElementById('erro-msg');
      erro.style.display = 'none';
      btn.textContent = 'Entrando...';
      btn.disabled = true;

      const usuario = document.getElementById('inp-usuario').value.trim();
      const senha   = document.getElementById('inp-senha').value;

      if (!usuario || !senha) {
        erro.textContent = 'Preencha usuário e senha.';
        erro.style.display = 'block';
        btn.textContent = 'Entrar';
        btn.disabled = false;
        return;
      }

      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({usuario, senha}),
        });
        const d = await r.json();
        if (!r.ok) {
          erro.textContent = d.error || 'Erro ao fazer login.';
          erro.style.display = 'block';
          btn.textContent = 'Entrar';
          btn.disabled = false;
          return;
        }
        window.location.href = '/';
      } catch {
        erro.textContent = 'Erro de conexão com o servidor.';
        erro.style.display = 'block';
        btn.textContent = 'Entrar';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
